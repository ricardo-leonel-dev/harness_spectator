<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; }
    a { color: #e8a33d; text-decoration: none; }
    a:hover { filter: brightness(1.15); }
    .hs-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    input::placeholder { color: #46505f; }
    input:focus { outline: none; border-color: {{accent}} !important; }
    .hs-submit:not(:disabled):hover { filter: brightness(1.1); }
    .hs-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    @keyframes hs-spin { to { transform: rotate(360deg); } }
    @keyframes hs-ping { 0% { transform: scale(1); opacity: 0.55; } 75%, 100% { transform: scale(2.6); opacity: 0; } }
  </style>
</helmet>

<div style="width:1280px;height:800px;background:#0a0d12;display:flex;align-items:center;justify-content:center;position:relative;">
  <div style="position:absolute;inset:0;background-image:radial-gradient(#131820 1px, transparent 1px);background-size:26px 26px;opacity:0.6;"></div>

  <form
    onSubmit="{{onSubmit}}"
    style="position:relative;display:flex;flex-direction:column;gap:16px;width:368px;padding:30px;background:#12161d;border:1px solid #212a35;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,0.55);"
  >
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:2px;">
      <span style="position:relative;display:inline-flex;width:12px;height:12px;">
        <span style="position:absolute;inset:0;border-radius:50%;background:{{accent}};animation:hs-ping 2.4s cubic-bezier(0.4,0,0.6,1) infinite;"></span>
        <span style="position:absolute;inset:0;border-radius:50%;background:{{accent}};"></span>
      </span>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <h1 style="margin:0;font-size:17px;font-weight:600;color:#f1f4f8;letter-spacing:-0.01em;">Sign in</h1>
        <p class="hs-mono" style="margin:0;font-size:10.5px;letter-spacing:0.14em;color:#5b6472;text-transform:uppercase;">harness · spectator</p>
      </div>
    </div>

    <label style="display:flex;flex-direction:column;gap:6px;">
      <span class="hs-mono" style="font-size:10px;letter-spacing:0.1em;color:#7c8797;text-transform:uppercase;">Email</span>
      <div style="position:relative;display:flex;align-items:center;">
        <svg style="position:absolute;left:10px;color:#46505f;" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
        <input
          type="email"
          value="{{email}}"
          onChange="{{onEmailChange}}"
          placeholder="you@example.com"
          autocomplete="email"
          class="hs-mono"
          style="width:100%;padding:9px 10px 9px 32px;background:#0a0d12;color:#e6eaf0;border:1px solid #212a35;border-radius:4px;font-size:12.5px;"
        />
      </div>
    </label>

    <label style="display:flex;flex-direction:column;gap:6px;">
      <span class="hs-mono" style="font-size:10px;letter-spacing:0.1em;color:#7c8797;text-transform:uppercase;">Password</span>
      <div style="position:relative;display:flex;align-items:center;">
        <svg style="position:absolute;left:10px;color:#46505f;" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M10.5 12.5 20 3M17 6l2 2M14 9l2 2"></path></svg>
        <input
          type="password"
          value="{{password}}"
          onChange="{{onPasswordChange}}"
          placeholder="••••••••"
          autocomplete="current-password"
          class="hs-mono"
          style="width:100%;padding:9px 10px 9px 32px;background:#0a0d12;color:#e6eaf0;border:1px solid #212a35;border-radius:4px;font-size:12.5px;"
        />
      </div>
    </label>

    <sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
      <div role="alert" style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(229,72,77,0.12);border:1px solid rgba(229,72,77,0.35);color:#f5b9bb;border-radius:4px;font-size:12px;">
        <span class="hs-mono" style="flex-shrink:0;color:#e5484d;font-size:10px;letter-spacing:0.08em;">[ERR]</span>
        {{errorText}}
      </div>
    </sc-if>

    <button
      type="submit"
      class="hs-submit"
      disabled="{{submitDisabled}}"
      style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;background:{{accent}};color:#0a0d12;border:none;border-radius:4px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;"
    >
      <sc-if value="{{submitting}}" hint-placeholder-val="{{false}}">
        <svg style="transform-box:fill-box;transform-origin:center;animation:hs-spin 0.8s linear infinite;" viewBox="0 0 24 24" width="13" height="13"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40 100"></circle></svg>
      </sc-if>
      {{submitLabel}}
    </button>

    <footer class="hs-mono" style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:9.5px;letter-spacing:0.08em;color:#46505f;text-transform:uppercase;margin-top:2px;">
      Secured by Supabase Auth
    </footer>
  </form>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e8a33d","options":["#e8a33d","#3ecfe0","#e85d75","#8bd450"]}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', password: '', submitting: false, error: null };
  }

  isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  onEmailChange = (e) => {
    this.setState({ email: e.target.value, error: null });
  };

  onPasswordChange = (e) => {
    this.setState({ password: e.target.value, error: null });
  };

  onSubmit = (e) => {
    e.preventDefault();
    if (!this.isValidEmail(this.state.email) || this.state.password.length === 0) return;
    this.setState({ submitting: true, error: null });
    setTimeout(() => {
      this.setState({ submitting: false, error: 'Invalid email or password.' });
    }, 900);
  };

  renderVals() {
    const valid = this.isValidEmail(this.state.email) && this.state.password.length > 0;
    return {
      accent: this.props.accent ?? '#e8a33d',
      email: this.state.email,
      password: this.state.password,
      submitting: this.state.submitting,
      hasError: !!this.state.error,
      errorText: this.state.error ?? '',
      submitLabel: this.state.submitting ? 'Signing in…' : 'Sign in',
      submitDisabled: !valid || this.state.submitting,
      onEmailChange: this.onEmailChange,
      onPasswordChange: this.onPasswordChange,
      onSubmit: this.onSubmit,
    };
  }
}
</script>
</body>
</html>
